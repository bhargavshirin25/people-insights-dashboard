# Entra (Azure AD) single sign-on.
#
# Activate with:  --spring.profiles.active=local,sso
# and supply the three tenant values as environment variables:
#
#   AZURE_CLIENT_ID       Application (client) ID of the app registration
#   AZURE_CLIENT_SECRET   Client secret value
#   AZURE_ISSUER_URI      https://login.microsoftonline.com/<tenant-id>/v2.0
#
# Register this exact redirect URI in the Entra app registration (Authentication > Web platform):
#   http://localhost:3000/api/auth/callback/azure-ad     (production: the deployed https origin,
#   same path)
#
# The path is fixed in code — SecurityConfig.OAUTH2_CALLBACK_PATH — because Spring's own default
# ("/login/oauth2/code/{registrationId}") is what the redirect URI in this file used to be. If the
# two ever drift apart, the callback filter stops matching incoming requests: Microsoft redirects
# back correctly, but nothing exchanges the code, and the request falls through to the ordinary
# authorization rules instead — an authentication error, not an "SSO isn't configured" one.
#
# Once this profile is active, EntraOidcUserService becomes the sign-in path. The IdP supplies
# identity only — role and BU assignment still come from app_users / bu_assignments, so a valid
# corporate login for an unprovisioned user is rejected rather than defaulted to a role.
#
# Set dashboard.dev-login-enabled=false in the same run to make SSO the only way in.

spring:
  security:
    oauth2:
      client:
        registration:
          azure:
            client-id: ${AZURE_CLIENT_ID}
            client-secret: ${AZURE_CLIENT_SECRET}
            scope: openid, profile, email
            authorization-grant-type: authorization_code
            redirect-uri: ${AZURE_REDIRECT_URI:{baseUrl}/api/auth/callback/azure-ad}
        provider:
          azure:
            issuer-uri: ${AZURE_ISSUER_URI}

dashboard:
  dev-login-enabled: ${DEV_LOGIN_ENABLED:false}
