services:
  mysql:
    image: mysql:8.4
    container_name: people-insights-mysql
    command:
      - --event-scheduler=ON
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
      - --max-allowed-packet=67108864
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD must be set in .env}
      MYSQL_DATABASE: people_insights
    volumes:
      - mysql-data:/var/lib/mysql
    ports:
      - "${MYSQL_HOST_PORT:-3307}:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD must be set in .env}"]
      interval: 5s
      timeout: 5s
      retries: 30
    restart: unless-stopped

  backend:
    build:
      context: ./backend
    container_name: people-insights-backend
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      MYSQL_URL: jdbc:mysql://mysql:3306/people_insights?rewriteBatchedStatements=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&characterEncoding=utf8
      MYSQL_USER: root
      MYSQL_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD must be set in .env}
      CLAUDE_API_KEY: ${CLAUDE_API_KEY:-}
      INGEST_DIR: /data/hr-ops
      # Entra SSO: application-sso.yml reads these. Activate only once they're supplied — an empty
      # client-id makes Spring's OAuth2 client registration fail at startup.
      SPRING_PROFILES_ACTIVE: sso
      AZURE_CLIENT_ID: ${AZURE_CLIENT_ID}
      AZURE_CLIENT_SECRET: ${AZURE_CLIENT_SECRET}
      AZURE_ISSUER_URI: ${AZURE_ISSUER_URI}
      AZURE_REDIRECT_URI: ${AZURE_REDIRECT_URI}
      POST_LOGIN_REDIRECT_URL: ${POST_LOGIN_REDIRECT_URL:-/}
      LOGIN_FAILURE_REDIRECT_URL: ${LOGIN_FAILURE_REDIRECT_URL:-/login?error}
      DEV_LOGIN_ENABLED: ${DEV_LOGIN_ENABLED:-true}
    volumes:
      - ${WORKBOOK_DIR}:/data/hr-ops
    ports:
      - "${BACKEND_HOST_PORT:-8081}:8080"
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        # Next.js bakes rewrite destinations into the build at `next build` time, so this has to be
        # a build arg rather than a runtime environment variable.
        BACKEND_ORIGIN: http://backend:8080
    container_name: people-insights-frontend
    depends_on:
      - backend
    ports:
      - "${FRONTEND_HOST_PORT:-3000}:3000"
    restart: unless-stopped

volumes:
  mysql-data:
